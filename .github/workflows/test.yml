name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install
        run: npm ci --no-fund
      # Format, lint, types, layer rules, unused code, suppressions, audit, and the tests with coverage.
      - name: Gate
        run: npm run gate
